table:
  name: finale_songs
  schema: public
array_relationships:
  - name: finale_charts
    using:
      foreign_key_constraint_on:
        column: song_id
        table:
          name: finale_charts
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - category
        - title
        - english_title
        - order
        - active
        - japan_only
        - version
      filter: {}
  - role: importer
    permission:
      columns:
        - id
        - category
        - title
        - english_title
        - order
        - active
        - japan_only
        - version
      filter: {}
  - role: user
    permission:
      columns:
        - id
        - category
        - title
        - english_title
        - order
        - active
        - japan_only
        - version
      filter: {}
