table:
  name: dx_intl_scores_with_history
  schema: public
object_relationships:
  - name: dx_intl_chart
    using:
      manual_configuration:
        column_mapping:
          deluxe: deluxe
          difficulty: difficulty
          song_id: song_id
        insertion_order: null
        remote_table:
          name: dx_intl_charts
          schema: public
  - name: dx_intl_player
    using:
      manual_configuration:
        column_mapping:
          player_id: id
        insertion_order: null
        remote_table:
          name: dx_intl_players
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - player_id
        - song_id
        - deluxe
        - difficulty
        - score
        - combo_flag
        - sync_flag
        - dx_score
        - max_dx_score
        - start
        - end
      filter:
        dx_intl_player:
          private:
            _ne: true
  - role: user
    permission:
      columns:
        - deluxe
        - combo_flag
        - sync_flag
        - difficulty
        - player_id
        - score
        - dx_score
        - max_dx_score
        - end
        - start
        - song_id
      filter:
        _or:
          - dx_intl_player:
              private:
                _ne: true
          - dx_intl_player:
              user_id:
                _eq: X-Hasura-User-Id
